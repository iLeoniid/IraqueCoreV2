name: IraqueCore
version: 1.0.0
main: gg.leo.IraqueCore.IraqueCore
api-version: '26.2'
softdepend: [PlaceholderAPI]

commands:
  rank:
    description: Rank management command
    aliases: [ranks]
    permission: iraquecore.rank
  tags:
    description: Tag management with GUI
    aliases: [tag]
    permission: iraquecore.tags.use
  msg:
    description: Send a private message to a player
    aliases: [message, whisper, tell, w, m]
    permission: iraquecore.msg
  r:
    description: Reply to the last private message
    aliases: [reply]
    permission: iraquecore.msg
  scoreboard:
    description: Toggle your scoreboard on/off
    aliases: [sb]
    permission: iraquecore.scoreboard
  reload:
    description: Reload all plugin configurations
    aliases: [icreload]
    permission: iraquecore.reload
  spawn:
    description: Teleport to spawn
    aliases: [hub, lobby]
  setspawn:
    description: Set the spawn location
    permission: iraquecore.setspawn
  gm:
    description: Change gamemode
    aliases: [gamemode, gmc, gms, gma, gmsp]
    permission: iraquecore.gamemode
  leaderboards:
    description: View player leaderboards
    aliases: [lb, leaders]
    permission: iraquecore.leaderboard
  motd:
    description: Reload MOTD configuration
    permission: iraquecore.motd.reload
  whitelist:
    description: Manage server whitelist
    aliases: [wl]
    permission: iraquecore.whitelist
  playtime:
    description: Check your playtime
    aliases: [pt]
    permission: iraquecore.playtime
  stats:
    description: View player stats
    aliases: [me]
    permission: iraquecore.stats
  perm:
    description: Manage player permissions
    aliases: [permission, perms]
    permission: iraquecore.permission
  grant:
    description: Grant a rank to a player
    aliases: [g]
    permission: iraquecore.grant
  grants:
    description: View grants of a player
    aliases: [grantlist, mygrants]
    permission: iraquecore.grants
  revoke:
    description: Revoke active grants from a player
    aliases: [un grant]
    permission: iraquecore.grant.revoke
  chatcolor:
    description: Open the chat color selector GUI
    aliases: [chatcolors, cc, colors]
    permission: iraquecore.chatcolor
  alert:
    description: Send alerts to players
    aliases: [alerta]
    permission: alert.use
  iraquecore:
    description: Plugin info
    aliases: [ic, core]
    permission: iraquecore.info
  tpa:
    description: Teleport request system
    aliases: [tpahere]
    permission: iraquecore.tpa
  home:
    description: Teleport to your home
    permission: iraquecore.home
  sethome:
    description: Set your home location
    permission: iraquecore.home
  delhome:
    description: Delete your home
    aliases: [deletehome]
    permission: iraquecore.home
  ban:
    description: Ban a player
    permission: iraquecore.ban
  unban:
    description: Unban a player
    aliases: [pardon]
    permission: iraquecore.unban
  mute:
    description: Mute a player
    permission: iraquecore.mute
  unmute:
    description: Unmute a player
    permission: iraquecore.unmute
  kick:
    description: Kick a player
    permission: iraquecore.kick
  heal:
    description: Heal yourself or another player
    aliases: [curar]
    permission: iraquecore.heal
  feed:
    description: Feed yourself or another player
    aliases: [alimentar]
    permission: iraquecore.feed
  trash:
    description: Open a trash inventory
    aliases: [lixeira, dispose]
    permission: iraquecore.trash
  removearmorstand:
    description: Remove the armor stand you are looking at
    aliases: [rms, removearmor]
    permission: iraquecore.removearmorstand

permissions:
  iraquecore.*:
    description: All IraqueCore permissions
    default: op
    children:
      iraquecore.admin: true
      iraquecore.tags.use: true
      iraquecore.tags.admin: true
      iraquecore.msg: true
      iraquecore.reload: true
      iraquecore.setspawn: true
      iraquecore.gamemode: true
      iraquecore.gamemode.other: true
      iraquecore.whitelist: true
      iraquecore.permission: true
      iraquecore.permission.add: true
      iraquecore.permission.remove: true
      iraquecore.permission.list: true
      iraquecore.permission.clear: true
      iraquecore.permission.check: true
      iraquecore.grant: true
      iraquecore.grants: true
      iraquecore.grant.revoke: true
      iraquecore.chatcolor: true
      iraquecore.home: true
      iraquecore.tpa: true
      iraquecore.ban: true
      iraquecore.unban: true
      iraquecore.mute: true
      iraquecore.unmute: true
      iraquecore.kick: true
      iraquecore.heal: true
      iraquecore.heal.other: true
      iraquecore.feed: true
      iraquecore.feed.other: true
      iraquecore.trash: true
      iraquecore.removearmorstand: true
      iraquecore.punishment.silent: true
      alert.use: true
      alert.list: true
      alert.reload: true
      alert.test: true
  iraquecore.admin:
    description: Access to admin commands
    default: op
  iraquecore.rank:
    description: Access to rank commands
    default: op
  iraquecore.rank.set:
    description: Set a player's rank
    default: op
  iraquecore.rank.create:
    description: Create custom ranks
    default: op
  iraquecore.tags.use:
    description: Use tag system
    default: true
  iraquecore.tags.admin:
    description: Administer tags
    default: op
  iraquecore.msg:
    description: Send and receive private messages
    default: true
  iraquecore.discord.reload:
    description: Reload Discord bot
    default: op
  iraque.scoreboard.admin:
    description: Admin del scoreboard
    default: op
    children:
      iraquecore.scoreboard: true
  iraquecore.scoreboard:
    description: Use scoreboard command
    default: true
  iraquecore.reload:
    description: Reload all plugin configurations
    default: op
  iraquecore.setspawn:
    description: Set the spawn location
    default: op
  iraquecore.gamemode:
    description: Change your gamemode
    default: op
  iraquecore.gamemode.other:
    description: Change other players' gamemode
    default: op
  iraquecore.leaderboard:
    description: View leaderboards
    default: true
  iraquecore.motd.reload:
    description: Reload MOTD configuration
    default: op
  iraquecore.whitelist:
    description: Manage server whitelist
    default: op
  iraquecore.playtime:
    description: Check your playtime
    default: true
  iraquecore.playtime.other:
    description: Check other players' playtime
    default: true
  iraquecore.anvilcolors:
    description: Use color codes in anvils
    default: true
  iraquecore.armorstand:
    description: Use armor stand editor
    default: true
  iraquecore.stats:
    description: View your stats
    default: true
  iraquecore.stats.other:
    description: View other players' stats
    default: true
  iraquecore.info:
    description: View plugin info
    default: true
  iraquecore.permission:
    description: Access to permission commands
    default: op
  iraquecore.permission.add:
    description: Add permissions to players
    default: op
  iraquecore.permission.remove:
    description: Remove permissions from players
    default: op
  iraquecore.permission.list:
    description: List a player's permissions
    default: op
  iraquecore.permission.clear:
    description: Clear all permissions from a player
    default: op
  iraquecore.permission.check:
    description: Check if a player has a permission
    default: op
  iraquecore.grant:
    description: Grant ranks to players
    default: op
  iraquecore.grants:
    description: View player grants
    default: op
  iraquecore.grant.revoke:
    description: Revoke grants from players
    default: op
  iraquecore.chatcolor:
    description: Use chat color commands
    default: true

  iraquecore.home:
    description: Use home commands
    default: true
  iraquecore.tpa:
    description: Use teleport request commands
    default: true

  alert.use:
    description: Send alerts
    default: op
  alert.list:
    description: List available alerts
    default: op
  alert.reload:
