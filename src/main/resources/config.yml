#   TELEPORT WARMUP
#   Delay before home / tpa / spawn teleports are executed
#   The teleport is cancelled if the player moves or takes damage

teleport:
  delay-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true

#   DATA STORAGE

storage:
  # Storage type: yaml, sqlite, mysql
  type: yaml
  # MySQL settings (only if type is mysql)
  mysql:
    host: localhost
    port: 3306
    database: iraquecore
    username: root
    password: ""
    pool-size: 10
