# ─────────────────────────────────────────────
#   IraqueCore - Advanced Core Configuration
#   Fully Configurable
# ─────────────────────────────────────────────

# General plugin settings
general:
  # Language (en, es, etc.)
  language: en
  # Automatically check for updates
  check-updates: true
  # Date format for placeholders
  date-format: "dd/MM/yyyy HH:mm"

# ─────────────────────────────────────────────
#   CHAT FORMAT SETTINGS
# ─────────────────────────────────────────────
chat:
  # Global chat format
  # Placeholders:
  #   {prefix} - Rank prefix
  #   {suffix} - Rank suffix
  #   {player} - Player name
  #   {displayname} - Player display name
  #   {message} - Chat message
  #   {tag} - Equipped tag
  #   {world} - World name
  format: "{prefix}{tag}{player}{suffix}: {message}"
  # Whether to use ranks in chat
  use-ranks: true
  # Whether to use tags in chat
  use-tags: true

# ─────────────────────────────────────────────
#   RANK SYSTEM
# ─────────────────────────────────────────────
ranks:
  # Default rank given to new players
  default-rank: "Member"
  # List of predefined ranks
  ranks:
    Owner:
      prefix: "&4&lOwner &4"
      suffix: ""
      weight: 100
      color: "&4"
      permissions:
        - "iraquecore.*"
    Admin:
      prefix: "&c&lAdmin &c"
      suffix: ""
      weight: 90
      color: "&c"
      permissions:
        - "iraquecore.*"
    Mod:
      prefix: "&5&lMod &5"
      suffix: ""
      weight: 80
      color: "&5"
      permissions:
        - "iraquecore.rank"
        - "iraquecore.rank.set"
    VIP:
      prefix: "&6&lVIP &6"
      suffix: ""
      weight: 60
      color: "&6"
      permissions: []
    Member:
      prefix: "&7"
      suffix: ""
      weight: 50
      color: "&7"
      permissions: []

# ─────────────────────────────────────────────
#   SCOREBOARD SYSTEM
