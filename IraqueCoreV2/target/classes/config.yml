      - "   &6&lEU PRACTI&f&lC&6&lE   "
      - "   &6&lEU PRACT&f&lI&6&lCE   "
      - "   &6&lEU PRAC&f&lT&6&lICE   "
      - "   &6&lEU PRA&f&lC&6&lTICE   "
      - "   &6&lEU PR&f&lA&6&lCTICE   "
      - "   &6&lEU P&f&lR&6&lACTICE   "
      - "   &6&lEU &f&lP&6&lRACTICE   "
      - "   &6&lEU&f&l &6&lPRACTICE   "
      - "   &6&lE&f&lU&6&l PRACTICE   "
      - "   &f&lE&6&lU PRACTICE   "
      - "   &6&lEU PRACTICE   "
      - "   &6&lEU PRACTICE   "
      - "   &f&lEU PRACTICE   "
      - "   &6&lEU PRACTICE   "
      - "   &f&lEU PRACTICE   "
      - "   &6&lEU PRACTICE   "
